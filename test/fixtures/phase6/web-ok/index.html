<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Box</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    main { max-width: 720px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    button, input { font-size: 16px; padding: 8px 12px; }
    #favorites { min-height: 40px; }
  </style>
</head>
<body>
  <main>
    <h1>Recipe Box</h1>
    <div class="row">
      <label>Search <input id="search" aria-label="Search recipes"></label>
      <button id="save" type="button">Save favorite</button>
    </div>
    <p id="status">No favorites yet.</p>
    <ul id="favorites"></ul>
  </main>
  <script>
    const favorites = [];
    document.getElementById('save').onclick = () => {
      const q = document.getElementById('search').value || 'Tomato soup';
      favorites.push(q);
      document.getElementById('status').textContent = 'Saved ' + q;
      const li = document.createElement('li');
      li.textContent = q;
      document.getElementById('favorites').appendChild(li);
    };
  </script>
</body>
</html>
